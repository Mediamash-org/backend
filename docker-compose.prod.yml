# MediaMash / OMSS — production stack (released image only)
#
# Pulls from GitHub Container Registry. No local Docker build required.
#
#   curl -fsSL https://github.com/Mediamash-org/backend/releases/latest/download/mediamash-backend-compose.zip -o compose.zip
#   unzip compose.zip && cp .env.example .env
#   # edit .env (TMDB_API_KEY, PUBLIC_URL) — image pin is in .env.image
#   set -a && source .env && source .env.image && set +a
#   docker compose up -d
#
# Or from a git clone:
#   cp .env.docker.example .env
#   # set OMSS_IMAGE=ghcr.io/mediamash-org/backend:<version>
#   docker compose -f docker-compose.prod.yml up -d
#
# Docs: docs/DEPLOYMENT.md

name: mediamash

services:
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
    volumes:
      - redis-data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  omss:
    image: ${OMSS_IMAGE:-ghcr.io/mediamash-org/backend:latest}
    pull_policy: ${OMSS_PULL_POLICY:-always}
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: ${PORT:-3000}
      CACHE_TYPE: redis
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      INTERNAL_DEBUG: "false"
    ports:
      - "${OMSS_HOST_PORT:-${PORT:-3000}}:${PORT:-3000}"
    # Image already ships /app/config/providers.json.
    # Only mount a host file if it exists as a *file* (not a directory).
    # If Docker ever created config/providers.json as a folder, remove it:
    #   rm -rf ./config/providers.json && cp providers.example.json ./config/providers.json
    # volumes:
    #   - ./config/providers.json:/app/config/providers.json:ro
    networks:
      - internal
      - edge
    healthcheck:
      test: ["CMD", "/app/scripts/docker-healthcheck.sh"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

networks:
  internal:
    driver: bridge
    internal: true
  edge:
    driver: bridge

volumes:
  redis-data:
