name: Docker release

# Build linux/amd64 image → GHCR, create GitHub Release with Compose deploy assets.
#
# Triggers: push tag vX.Y.Z · Actions → Run workflow
# Local:    npm run release -- 1.2.0

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to rebuild (e.g. v1.2.0). Empty = publish :edge from default branch (no GitHub Release)."
        required: false
        type: string

concurrency:
  group: docker-release-${{ github.workflow }}-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  attestations: write
  id-token: write

env:
  REGISTRY: ghcr.io
  DOCKER_PLATFORMS: linux/amd64

jobs:
  release:
    name: Build & publish
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Resolve ref & version
        id: ver
        run: |
          set -euo pipefail
          EVENT="${{ github.event_name }}"
          INPUT_TAG="${{ inputs.tag }}"

          if [ "$EVENT" = "workflow_dispatch" ] && [ -n "$INPUT_TAG" ]; then
            REF="$INPUT_TAG"
          elif [ "$EVENT" = "push" ] && [[ "${{ github.ref }}" == refs/tags/* ]]; then
            REF="${{ github.ref_name }}"
          else
            REF=""
          fi

          if [ -n "$REF" ]; then
            VERSION="${REF#v}"
            IS_RELEASE=true
            if [[ "$VERSION" == *-* ]]; then
              IS_PRERELEASE=true
            else
              IS_PRERELEASE=false
            fi
          else
            VERSION=edge
            IS_RELEASE=false
            IS_PRERELEASE=false
            REF="${{ github.sha }}"
          fi

          {
            echo "ref=${REF}"
            echo "version=${VERSION}"
            echo "is_release=${IS_RELEASE}"
            echo "is_prerelease=${IS_PRERELEASE}"
          } >> "$GITHUB_OUTPUT"

          echo "Resolved ref=${REF} version=${VERSION} release=${IS_RELEASE}"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ steps.ver.outputs.ref }}

      - name: Image name
        id: image
        run: |
          IMAGE="${REGISTRY}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "Publishing ${IMAGE}"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.image }}
          tags: |
            type=raw,value=${{ steps.ver.outputs.version }}
            type=raw,value=latest,enable=${{ steps.ver.outputs.is_release == 'true' && steps.ver.outputs.is_prerelease == 'false' }}
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.title=MediaMash OMSS backend
            org.opencontainers.image.description=OMSS streaming backend for MediaMash
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.ver.outputs.version }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: ${{ env.DOCKER_PLATFORMS }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

      - name: Package Compose deploy assets
        id: bundle
        if: steps.ver.outputs.is_release == 'true'
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          OUT=dist-release
          rm -rf "$OUT"
          mkdir -p "$OUT/config"

          # Ship as docker-compose.yml so `docker compose up` works after unzip.
          cp docker-compose.prod.yml "$OUT/docker-compose.yml"
          cp .env.docker.example "$OUT/.env.example"
          cp deploy/README.md "$OUT/README.md"

          if [ -f config/providers.example.json ]; then
            cp config/providers.example.json "$OUT/providers.example.json"
            cp config/providers.example.json "$OUT/config/providers.json"
          elif [ -f config/providers.json ]; then
            cp config/providers.json "$OUT/providers.example.json"
            cp config/providers.json "$OUT/config/providers.json"
          fi

          {
            echo "# Image pin for this GitHub Release — merge into .env or export before compose up"
            echo "OMSS_IMAGE=${IMAGE}:${VERSION}"
            echo "OMSS_PULL_POLICY=always"
          } > "$OUT/.env.image"

          # Convenience: pre-fill OMSS_IMAGE inside a copy of the env example
          {
            echo "# Generated for release v${VERSION} — copy to .env and set TMDB_API_KEY + PUBLIC_URL"
            echo ""
            echo "OMSS_IMAGE=${IMAGE}:${VERSION}"
            echo "OMSS_PULL_POLICY=always"
            echo ""
            # Drop commented OMSS_IMAGE block from example to avoid confusion
            grep -v '^#   OMSS_IMAGE=' .env.docker.example \
              | grep -v '^#   OMSS_PULL_POLICY=' \
              | grep -v '^# OMSS_IMAGE=' \
              | grep -v '^# OMSS_PULL_POLICY=' \
              | grep -v '^OMSS_IMAGE=' \
              | grep -v '^OMSS_PULL_POLICY='
          } > "$OUT/.env.release.example"

          ZIP="mediamash-backend-${VERSION}-compose.zip"
          (cd "$OUT" && zip -r "../${ZIP}" .)
          echo "zip=${ZIP}" >> "$GITHUB_OUTPUT"
          ls -la "$OUT" "${ZIP}"

      - name: Generate release notes
        id: notes
        if: steps.ver.outputs.is_release == 'true'
        env:
          TAG: v${{ steps.ver.outputs.version }}
          IMAGE: ${{ steps.image.outputs.image }}
          VERSION: ${{ steps.ver.outputs.version }}
          ZIP: ${{ steps.bundle.outputs.zip }}
        run: |
          set -euo pipefail
          {
            echo "## MediaMash backend \`${TAG}\`"
            echo ""
            echo "Production Docker image for Compose."
            echo ""
            echo "### Quick start (recommended)"
            echo ""
            echo "1. Download **\`${ZIP}\`** from this release (Assets below)."
            echo "2. Unzip, copy \`.env.example\` → \`.env\`, set \`TMDB_API_KEY\` and \`PUBLIC_URL\`."
            echo "3. Merge image pin from \`.env.image\` into \`.env\` (or export it)."
            echo "4. Start:"
            echo ""
            echo "\`\`\`bash"
            echo "unzip ${ZIP} -d mediamash && cd mediamash"
            echo "cp .env.example .env"
            echo "# edit .env — TMDB_API_KEY, PUBLIC_URL"
            echo "cat .env.image >> .env"
            echo "docker compose up -d"
            echo "curl -fsS http://127.0.0.1:3000/"
            echo "\`\`\`"
            echo ""
            echo "### Docker (GHCR)"
            echo ""
            echo "\`\`\`bash"
            echo "docker pull ${IMAGE}:${VERSION}"
            if [ "${{ steps.ver.outputs.is_prerelease }}" != "true" ]; then
              echo "docker pull ${IMAGE}:latest"
            fi
            echo "\`\`\`"
            echo ""
            echo "From a git clone:"
            echo ""
            echo "\`\`\`env"
            echo "OMSS_IMAGE=${IMAGE}:${VERSION}"
            echo "OMSS_PULL_POLICY=always"
            echo "\`\`\`"
            echo ""
            echo "\`\`\`bash"
            echo "docker compose -f docker-compose.prod.yml pull"
            echo "docker compose -f docker-compose.prod.yml up -d"
            echo "\`\`\`"
            echo ""
            echo "Docs: [DEPLOYMENT](https://github.com/${{ github.repository }}/blob/${TAG}/docs/DEPLOYMENT.md) · [RELEASING](https://github.com/${{ github.repository }}/blob/${TAG}/docs/RELEASING.md)"
            echo ""
            echo "### Changes"
            echo ""
          } > release-body.md

          PREV="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"
          if [ -n "${PREV}" ]; then
            echo "Compared to \`${PREV}\`:" >> release-body.md
            echo "" >> release-body.md
            git log --pretty=format:'- %s (%h)' "${PREV}..${TAG}" >> release-body.md || true
          else
            echo "_First tagged release._" >> release-body.md
          fi

      - name: Create GitHub Release
        if: steps.ver.outputs.is_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: MediaMash backend v${{ steps.ver.outputs.version }}
          body_path: release-body.md
          draft: false
          prerelease: ${{ steps.ver.outputs.is_prerelease == 'true' }}
          generate_release_notes: true
          make_latest: ${{ steps.ver.outputs.is_prerelease == 'false' }}
          files: |
            ${{ steps.bundle.outputs.zip }}
            dist-release/docker-compose.yml
            dist-release/.env.example
            dist-release/.env.image
            dist-release/.env.release.example
            dist-release/README.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          {
            echo "## Published"
            echo ""
            echo "- **Image:** \`${{ steps.image.outputs.image }}\`"
            echo "- **Version tag:** \`${{ steps.ver.outputs.version }}\`"
            echo "- **Platforms:** \`${{ env.DOCKER_PLATFORMS }}\`"
            echo "- **Digest:** \`${{ steps.build.outputs.digest }}\`"
            if [ "${{ steps.ver.outputs.is_release }}" = "true" ]; then
              echo "- **Compose zip:** \`${{ steps.bundle.outputs.zip }}\`"
              echo "- **GitHub Release:** created/updated for \`v${{ steps.ver.outputs.version }}\`"
            fi
            echo ""
            echo "\`\`\`"
            echo "${{ steps.meta.outputs.tags }}"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"
