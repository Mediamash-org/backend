name: Docker release

# Push a semver tag to build, publish GHCR images, and create a GitHub Release.
# Local helper: npm run release -- 1.2.0
#
# Images (public packages after first publish + visibility set):
#   ghcr.io/<org>/<repo>:<tag>
#   ghcr.io/<org>/<repo>:latest          (for stable vX.Y.Z only)
#   ghcr.io/<org>/<repo>:sha-<short>

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing git tag to rebuild (e.g. v1.2.0). Leave empty to build the default branch as :edge."
        required: false
        type: string

permissions:
  contents: write
  packages: write
  attestations: write
  id-token: write

env:
  REGISTRY: ghcr.io

jobs:
  release:
    name: Build & publish
    runs-on: ubuntu-latest
    timeout-minutes: 45

    outputs:
      version: ${{ steps.meta.outputs.version }}
      tags: ${{ steps.meta.outputs.tags }}
      image: ${{ steps.image.outputs.image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - name: Image name
        id: image
        run: |
          # ghcr.io requires lowercase owner/repo
          IMAGE="${REGISTRY}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "Publishing ${IMAGE}"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
            type=raw,value=edge,enable=${{ github.event_name == 'workflow_dispatch' && inputs.tag == '' }}
            type=sha,prefix=sha-,format=short

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Generate release notes
        id: notes
        if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          {
            echo "## MediaMash / OMSS ${TAG}"
            echo ""
            echo "### Container images"
            echo ""
            echo "\`\`\`bash"
            echo "docker pull ${IMAGE}:${TAG#v}"
            echo "docker pull ${IMAGE}:latest"
            echo "\`\`\`"
            echo ""
            echo "Or with Compose — set in \`.env\`:"
            echo ""
            echo "\`\`\`env"
            echo "OMSS_IMAGE=${IMAGE}:${TAG#v}"
            echo "\`\`\`"
            echo ""
            echo "Docs: [DEPLOYMENT.md](https://github.com/${{ github.repository }}/blob/${TAG}/docs/DEPLOYMENT.md) · [RELEASING.md](https://github.com/${{ github.repository }}/blob/${TAG}/docs/RELEASING.md)"
            echo ""
            echo "### Changes"
            echo ""
          } > "$GITHUB_WORKSPACE/release-body.md"

          PREV="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"
          if [ -n "$PREV" ]; then
            echo "Compared to \`${PREV}\`:" >> "$GITHUB_WORKSPACE/release-body.md"
            echo "" >> "$GITHUB_WORKSPACE/release-body.md"
            git log --pretty=format:'- %s (%h)' "${PREV}..${TAG}" >> "$GITHUB_WORKSPACE/release-body.md"
          else
            echo "_First tagged release._" >> "$GITHUB_WORKSPACE/release-body.md"
          fi

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: ${{ inputs.tag || github.ref_name }}
          body_path: release-body.md
          draft: false
          prerelease: ${{ contains(inputs.tag || github.ref_name, '-') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
